services:
  dworkspace:
    build: .
    # Or use the prebuilt image instead of build:
    # image: ghcr.io/saltmd/salt.md:latest
    ports:
      - "8420:8420"
    volumes:
      - dworkspace-data:/data
    # A container cannot see how much of the host it is meant to get, so
    # without a limit dworkspace assumes a small machine and indexes fewer large
    # PDFs than it could. Raise this to what you actually want to give it —
    # it only affects how much text reaches the search index, never whether an
    # upload succeeds. In nested setups (Docker inside LXC) neither the cgroup
    # nor /proc/meminfo tells the truth; use DWORKSPACE_MEMORY_MB there.
    mem_limit: 4g
    environment:
      DWORKSPACE_ADDR: ":8420"
      DWORKSPACE_DATA: "/data"
      # DWORKSPACE_MEMORY_MB: "4096"
      # For HTTPS, mount certs and point these at them:
      # DWORKSPACE_TLS_CERT: "/certs/fullchain.pem"
      # DWORKSPACE_TLS_KEY: "/certs/privkey.pem"
    restart: unless-stopped

volumes:
  dworkspace-data:
